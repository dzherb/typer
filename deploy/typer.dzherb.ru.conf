# /etc/nginx/sites-available/typer.dzherb.ru
#
# Static files only — every note lives on the writer's own machine, so there is
# nothing here to protect and no application to run.

server {
    listen 80;
    listen [::]:80;
    server_name typer.dzherb.ru;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "http2 on;" is nginx 1.25.1+; this box runs 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name typer.dzherb.ru;

    ssl_certificate     /etc/letsencrypt/live/typer.dzherb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typer.dzherb.ru/privkey.pem;

    root /var/www/typer;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed file names: these can never change under a given URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Stable names, so no "immutable" — but they change about never.
    location /fonts/ { add_header Cache-Control "public, max-age=604800"; }
    location /icons/ { add_header Cache-Control "public, max-age=604800"; }

    # Revalidate on every load, or a deploy would never reach an installed app.
    location = /sw.js               { add_header Cache-Control "no-cache"; }
    location = /index.html          { add_header Cache-Control "no-cache"; }
    # .webmanifest is absent from nginx's mime.types, so without this it goes
    # out as application/octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
